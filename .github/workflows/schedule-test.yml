name: Schedule Test

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Print schedule test timestamp
        run: |
          echo "Schedule test triggered successfully."
          echo "UTC: $(date -u '+%Y-%m-%d %H:%M:%S')"
