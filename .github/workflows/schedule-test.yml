name: Schedule Test

on:
  schedule:
    # Offset from the common :00/:05 boundaries to reduce scheduler congestion.
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Print schedule test timestamp
        run: |
          echo "Schedule test triggered successfully."
          echo "UTC: $(date -u '+%Y-%m-%d %H:%M:%S')"
