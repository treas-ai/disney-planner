name: Collect TDR live data

on:
  schedule:
    # 08:00-21:55 JST, every 5 minutes.
    - cron: '*/5 8-21 * * *'
      timezone: 'Asia/Tokyo'
    # Final collection at 22:00 JST.
    - cron: '0 22 * * *'
      timezone: 'Asia/Tokyo'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tdr-live-data-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record schedule diagnostic
        run: python3 tool/log_schedule_diagnostic.py

      - name: Collect TDL/TDS waits and DPA states
        run: python3 tool/github_collect_themeparks_wiki.py
        continue-on-error: true

      - name: Commit new observations
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- tool/wait_data/github_history tool/wait_data/dpa_history tool/wait_data/unmatched tool/wait_data/schedule_diagnostics.csv)" ]; then
            echo "No new observations."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tool/wait_data/github_history tool/wait_data/dpa_history tool/wait_data/unmatched tool/wait_data/schedule_diagnostics.csv
          git commit -m "data: collect TDR live observations [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
