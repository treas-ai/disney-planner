name: Collect TDR live data

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tdr-live-data-branch
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout application source from main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout live data branch
        uses: actions/checkout@v4
        with:
          ref: live-data
          path: .live-data
          fetch-depth: 0

      - name: Record schedule diagnostic
        env:
          DISNEY_PLANNER_WAIT_DATA_ROOT: ${{ github.workspace }}/.live-data/tool/wait_data
        run: python3 tool/log_schedule_diagnostic.py

      - name: Collect TDL/TDS waits and DPA states
        env:
          DISNEY_PLANNER_WAIT_DATA_ROOT: ${{ github.workspace }}/.live-data/tool/wait_data
        run: python3 tool/github_collect_themeparks_wiki.py
        continue-on-error: true

      - name: Commit new observations to live-data
        working-directory: .live-data
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- tool/wait_data/github_history tool/wait_data/dpa_history tool/wait_data/unmatched tool/wait_data/schedule_diagnostics.csv)" ]; then
            echo "No new observations."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tool/wait_data/github_history tool/wait_data/dpa_history tool/wait_data/unmatched tool/wait_data/schedule_diagnostics.csv
          git commit -m "data: collect TDR live observations [skip ci]"
          git pull --rebase origin live-data
          git push origin HEAD:live-data
