name: Compact TDR history

on:
  schedule:
    # 00:20 JST on the 2nd day of each month.
    - cron: '20 15 1 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tdr-live-data-branch
  cancel-in-progress: false

jobs:
  compact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout application source from main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout live data branch
        uses: actions/checkout@v4
        with:
          ref: live-data
          path: .live-data
          fetch-depth: 0

      - name: Compact previous month in live-data
        env:
          DISNEY_PLANNER_WAIT_DATA_ROOT: ${{ github.workspace }}/.live-data/tool/wait_data
        run: python3 tool/compact_wait_history.py

      - name: Commit compacted history to live-data
        working-directory: .live-data
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- tool/wait_data)" ]; then
            echo "Nothing to compact."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tool/wait_data
          git commit -m "data: compact monthly TDR history [skip ci]"
          git pull --rebase origin live-data
          git push origin HEAD:live-data
