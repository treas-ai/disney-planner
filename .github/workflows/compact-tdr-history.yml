name: Compact TDR history

on:
  schedule:
    # 00:20 JST on the 2nd day of each month.
    - cron: '20 15 1 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tdr-history-compaction
  cancel-in-progress: false

jobs:
  compact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compact previous month
        run: python3 tool/compact_wait_history.py

      - name: Commit compacted history
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- tool/wait_data)" ]; then
            echo "Nothing to compact."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tool/wait_data
          git commit -m "data: compact monthly TDR history [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
