name: Rebuild TDR wait profiles

on:
  schedule:
    # 23:35 JST every day.
    - cron: '35 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tdr-wait-profile-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout application source from main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout live data branch
        uses: actions/checkout@v4
        with:
          ref: live-data
          path: .live-data
          fetch-depth: 1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Rebuild accumulated wait profiles from live-data
        run: dart run tool/rebuild_github_wait_profiles.dart --data-root .live-data/tool/wait_data

      - name: Audit wait profile coverage
        run: python tool/audit_wait_profile_coverage.py --data-root .live-data/tool/wait_data --live-ref live-data

      - name: Commit regenerated profiles to main
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- assets/master/wait_profiles assets/master/crowd_factors docs/current/WAIT_PROFILE_COVERAGE_AUDIT.md)" ]; then
            echo "No profile changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/master/wait_profiles assets/master/crowd_factors docs/current/WAIT_PROFILE_COVERAGE_AUDIT.md
          git commit -m "data: rebuild TDR wait profiles [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
