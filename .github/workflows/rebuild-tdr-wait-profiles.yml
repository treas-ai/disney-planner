name: Rebuild TDR wait profiles

on:
  schedule:
    # 23:35 JST every day.
    - cron: '35 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tdr-wait-profile-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Rebuild accumulated wait profiles
        run: dart run tool/rebuild_github_wait_profiles.dart

      - name: Commit regenerated profiles
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- assets/master/wait_profiles assets/master/crowd_factors)" ]; then
            echo "No profile changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/master/wait_profiles assets/master/crowd_factors
          git commit -m "data: rebuild TDR wait profiles [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
