name: disney_planner
description: "A new Flutter project."

publish_to: 'none'

version: 7.3.12+73120

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  sqflite: ^2.4.3
  sqflite_common_ffi: ^2.4.2
  path: ^1.9.1
  url_launcher: ^6.3.2
  file_picker: ^11.0.3
  share_plus: ^12.0.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.0
  cross_file: ^0.3.5+1
  http: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/movement/
    - assets/live/
    - assets/master/
    - assets/master/events/
    - assets/master/events/wish_packs/
    - assets/master/wait_profiles/
    - assets/master/crowd_factors/
    - assets/master/free_drink_profiles/
    - assets/master/historical_wait/
    - assets/master/dpa_sellout/
    - assets/master/live_mapping/
    - assets/master/tokyo/tdl/
    - assets/master/tokyo/tds/
    - assets/data/attractions.json
    - assets/data/restaurants.json
    - assets/data/shops.json
    - assets/data/shows.json